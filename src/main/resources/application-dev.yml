spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql9:3306/bus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: bus
    password:



springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /swagger-ui
    url: /api/v3/api-docs



logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: info



management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
