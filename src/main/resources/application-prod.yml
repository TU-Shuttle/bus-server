spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql9:3306/bus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: bus
    password:



springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false



logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: off



management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
