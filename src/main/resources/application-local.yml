spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:${DB_PORT:58816}/bus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:bus}
    password: ${DB_PASSWORD:}

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true



logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: trace

naver:
  map:
    api:
      client-id: ${NAVER_MAP_CLIENT_ID:}
      client-secret: ${NAVER_MAP_CLIENT_SECRET:}
